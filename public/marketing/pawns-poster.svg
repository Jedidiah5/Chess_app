<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="presentation">
  <defs>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#241d15" />
    </pattern>
    <!-- Same lathe profile as PaperPawnsScene, mirrored into a silhouette -->
    <path
      id="pawn"
      d="M 0,400 L 136,400 L 138,381.6 L 120,369.6 L 102.4,361.6 L 90.4,353.6 L 98.4,345.6 L 90.4,337.6 L 70.4,325.6 L 62.4,288 L 55.2,240 L 50.4,192 L 47.2,159.2 L 60,141.6 L 46.4,129.6 L 58.4,113.6 L 74,85.6 L 76,60 L 64,34 L 38.4,15.2 L 0,8 L -38.4,15.2 L -64,34 L -76,60 L -74,85.6 L -58.4,113.6 L -46.4,129.6 L -60,141.6 L -47.2,159.2 L -50.4,192 L -55.2,240 L -62.4,288 L -70.4,325.6 L -90.4,337.6 L -98.4,345.6 L -90.4,353.6 L -102.4,361.6 L -120,369.6 L -138,381.6 L -136,400 L 0,400 Z"
    />
  </defs>

  <rect width="800" height="1000" fill="#e8dfcc" />

  <!-- ink pawn: back and high. The path's own baseline sits at y=400. -->
  <ellipse cx="543" cy="700" rx="130" ry="22" fill="#6b4a22" opacity="0.15" />
  <g transform="translate(540 280) scale(1.05)">
    <use href="#pawn" fill="#241d15" stroke="#241d15" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- cream pawn: forward and low -->
  <ellipse cx="292" cy="830" rx="176" ry="28" fill="#6b4a22" opacity="0.13" />
  <g transform="translate(290 330) scale(1.25)">
    <use href="#pawn" fill="#fbf6ec" stroke="#241d15" stroke-width="6" stroke-linejoin="round" />
  </g>

  <rect width="800" height="1000" fill="url(#halftone)" opacity="0.085" />
</svg>
